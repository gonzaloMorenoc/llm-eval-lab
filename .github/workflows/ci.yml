name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run ruff linter
        run: ruff check src/ tests/
      - name: Run ruff formatter check
        run: ruff format --check src/ tests/
      - name: Run mypy
        run: mypy src/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        # The dashboard extra is required: tests/test_dashboard_shared.py imports
        # src.dashboard.components.shared, which imports streamlit. Without it the
        # whole test job dies on collection.
        run: pip install -e ".[dashboard,dev]"
      - name: Report installed versions
        run: pip list
      - name: Verify every module imports
        # A module that fails to import shows up in the test run as a cryptic
        # "module has no attribute X" from mock.patch, hiding the real
        # ImportError. Surface it here instead, with the actual traceback.
        run: |
          python - <<'PY'
          import importlib, pkgutil, sys, traceback
          failed = []
          for mod in pkgutil.walk_packages(["src"], prefix="src."):
              if ".dashboard.pages" in mod.name:
                  continue  # Streamlit pages execute on import by design
              try:
                  importlib.import_module(mod.name)
              except Exception:
                  failed.append(mod.name)
                  print(f"\n=== {mod.name} ===", flush=True)
                  traceback.print_exc()
          sys.exit(1 if failed else 0)
          PY
      - name: Run tests with coverage
        run: pytest tests/ --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=80 -v
      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # gate-dogfood is an end-to-end plumbing test only (install -> run -> gate
  # computation -> exit code) — it is NOT a regression detector. The committed
  # mock baseline has a 7% pass rate (3 of 43 cases), and all 7 critical-severity
  # cases already fail in it, so the no_new_critical_failures hard rule can never
  # fire here for any future change; the only gated metric (pass_rate) has just
  # those 3 passing cases as its entire headroom. A green run here proves the
  # plumbing works, not that a real regression would be caught.
  gate-dogfood:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Run regression gate against the mock baseline
        uses: ./
        with:
          provider: mock
          baseline: tests/fixtures/baseline_mock.json
          samples: "3"
          evaluators: rule_based,safety
