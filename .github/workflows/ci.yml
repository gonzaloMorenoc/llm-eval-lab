name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run ruff linter
        run: ruff check src/ tests/
      - name: Run ruff formatter check
        run: ruff format --check src/ tests/
      - name: Run mypy
        run: mypy src/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests with coverage
        run: pytest tests/ --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=80 -v
      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # gate-dogfood is an end-to-end plumbing test only (install -> run -> gate
  # computation -> exit code) — it is NOT a regression detector. The committed
  # mock baseline has a 7% pass rate (3 of 43 cases), and all 7 critical-severity
  # cases already fail in it, so the no_new_critical_failures hard rule can never
  # fire here for any future change; the only gated metric (pass_rate) has just
  # those 3 passing cases as its entire headroom. A green run here proves the
  # plumbing works, not that a real regression would be caught.
  gate-dogfood:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Run regression gate against the mock baseline
        uses: ./
        with:
          provider: mock
          baseline: tests/fixtures/baseline_mock.json
          samples: "3"
          evaluators: rule_based,safety
